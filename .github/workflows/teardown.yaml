name: Teardown Infrastructure

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    name: Destroy All Infrastructure
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init

      - name: Destroy GKE first
        working-directory: environments/prod
        run: terraform destroy -auto-approve -target=module.gke

      - name: Destroy NAT second
        working-directory: environments/prod
        run: terraform destroy -auto-approve -target=module.nat

      - name: Destroy VPC third
        working-directory: environments/prod
        run: terraform destroy -auto-approve -target=module.vpc

      - name: Destroy IAM last
        working-directory: environments/prod
        run: terraform destroy -auto-approve -target=module.iam
