apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-telemetry-app
  namespace: {{ .Values.namespace }}
  labels:
    app: f1-telemetry-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: f1-telemetry-app
  template:
    metadata:
      labels:
        app: f1-telemetry-app
    spec:
      serviceAccountName: f1-app-sa
      tolerations:
        - key: spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: f1-telemetry-app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: f1-db-password
                  key: password
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
